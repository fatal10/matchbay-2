<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060c0d">
<meta name="color-scheme" content="dark">
<title>MatchBay – Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Tokens (same as the rest of MatchBay) ============ */
:root{
  --bg:#060c0d;            --bg-rgb:6,12,13;
  --surface:#101a1c;       --surface-rgb:16,26,28;
  --surface-2:#172426;
  --surface-hover:#1b2b2e;
  --border:#223335;        --border-hover:#2f4a4c;
  --text:#eefaf7;          --text-rgb:238,250,247;
  --text-secondary:#9bb5b0;
  --text-tertiary:#678280;
  --accent:#1de4b8;        --accent-rgb:29,228,184;
  --accent-hover:#4cf0cc;
  --on-accent:#04201a;
  --flag-red:#c60b1e;      --flag-yellow:#ffc400;

  --club:hsl(215 78% 58%);                       /* set from the player's club */

  --r-sm:12px; --r-md:18px; --r-lg:28px; --r-pill:999px;
  --gutter:20px;
  --fw:clamp(340px,112vw,480px);                 /* width of the standing figure */
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{max-width:480px;margin:0 auto;position:relative}

/* ============ Top bar ============ */
.top{
  position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:30;width:min(100%,480px);
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid transparent;
  transition:background .25s var(--ease),border-color .25s var(--ease);
}
.top.is-scrolled{background:rgba(var(--bg-rgb),.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom-color:var(--border)}
.top__t{text-align:center;font-size:1rem;font-weight:700}
.icon-btn{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(var(--bg-rgb),.55);border:1px solid var(--border);
  transition:background .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease),color .2s var(--ease);
}
.icon-btn:hover{background:var(--surface-hover);border-color:var(--border-hover)}
.icon-btn:active{transform:scale(.92)}
.icon-btn[aria-pressed="true"]{color:var(--accent);border-color:rgba(var(--accent-rgb),.5);background:rgba(var(--accent-rgb),.12)}
.icon-btn[aria-pressed="true"] svg{fill:var(--accent);animation:pop .3s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:none}}

/* ============ Hero ============ */
.hero{position:relative;height:calc(var(--fw) + 36px);overflow:hidden;isolation:isolate}
.hero__bg{position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(62% 56% at 50% 34%,color-mix(in srgb,var(--club) 42%,transparent),transparent 72%),
    radial-gradient(90% 40% at 50% -8%,rgba(var(--accent-rgb),.22),transparent 70%),
    repeating-linear-gradient(90deg,rgba(var(--accent-rgb),.045) 0 30px,transparent 30px 60px),
    linear-gradient(180deg,rgba(var(--surface-rgb),.4),var(--bg));
}
.hero__bg::after{ /* pitch arc */
  content:"";position:absolute;left:50%;bottom:-62%;width:150%;aspect-ratio:1;border-radius:50%;
  transform:translateX(-50%);border:1.5px solid rgba(var(--accent-rgb),.16);
}
.hero__name{ /* giant outlined surname behind the player */
  position:absolute;left:50%;top:21%;z-index:-1;white-space:nowrap;
  font-size:clamp(4.75rem,26vw,7.5rem);font-weight:800;letter-spacing:-.03em;line-height:1;text-transform:uppercase;
  color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--club) 55%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--club) 24%,transparent),transparent 85%);
  -webkit-background-clip:text;background-clip:text;
  transform:translate(-50%,calc(var(--py,0) * .22px));
  animation:nameIn 1s var(--ease) .1s backwards;
}
@keyframes nameIn{from{opacity:0;letter-spacing:.04em}to{opacity:1}}

.figure{
  position:absolute;bottom:0;left:50%;width:var(--fw);height:var(--fw);margin-left:calc(var(--fw) / -2);z-index:2;
  -webkit-mask-image:linear-gradient(180deg,black 0,black 58%,transparent 97%);
          mask-image:linear-gradient(180deg,black 0,black 58%,transparent 97%);
}
.figure__in{width:100%;height:100%;animation:figIn .85s var(--ease) .1s backwards;transform:translateY(calc(var(--py,0) * .05px))}
@keyframes figIn{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1}}
.figure img,.figure svg{width:100%;height:100%;display:block;object-fit:contain;
  filter:drop-shadow(0 0 26px color-mix(in srgb,var(--club) 40%,transparent))}

/* silhouette (no photo) */
.sil__body,.sil__neck,.sil__head{fill:url(#silG);stroke:rgba(var(--text-rgb),.12);stroke-width:2}
.sil__hair{fill:color-mix(in srgb,var(--club) 30%,var(--bg))}
.sil__arm{fill:none;stroke:rgba(var(--text-rgb),.08);stroke-width:3;stroke-linecap:round}
.sil__ini{fill:rgba(var(--text-rgb),.16);font-family:var(--font);font-size:84px;font-weight:800;letter-spacing:-.02em}
.nophoto{
  position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:3;white-space:nowrap;
  padding:6px 14px;border-radius:var(--r-pill);font-size:.6875rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-secondary);background:rgba(var(--bg-rgb),.7);border:1px dashed var(--border-hover);
  animation:rise .6s var(--ease) .5s backwards;
}

/* floating chips on the hero */
.fchip{position:absolute;z-index:4;top:calc(78px + env(safe-area-inset-top));animation:rise .6s var(--ease) .45s backwards}
.club-chip{
  left:16px;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:var(--r-pill);
  background:rgba(var(--surface-rgb),.75);border:1px solid var(--border);font-size:.8125rem;font-weight:800;
}
.gk{
  right:16px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  font-size:.9375rem;font-weight:800;color:var(--accent);
  background:rgba(var(--bg-rgb),.7);border:2px solid var(--accent);box-shadow:0 0 22px rgba(var(--accent-rgb),.3);
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.crest{
  flex:0 0 auto;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  font-weight:800;letter-spacing:-.01em;border:2px solid transparent;
  background:
    linear-gradient(var(--bg),var(--bg)) padding-box,
    linear-gradient(140deg,var(--club),color-mix(in srgb,var(--club) 35%,var(--accent))) border-box;
}
.crest--sm{width:28px;height:28px;font-size:.5625rem}
.crest--md{width:44px;height:44px;font-size:.8125rem}

/* ============ Identity ============ */
.id{position:relative;z-index:3;margin-top:-92px;padding:0 var(--gutter);text-align:center}
.id > *{animation:rise .6s var(--ease) calc(.25s + var(--i,0) * 80ms) backwards}
.id__first{font-size:.8125rem;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:var(--text-secondary)}
.id__last{margin-top:2px;font-size:clamp(2.25rem,12vw,3rem);font-weight:800;letter-spacing:-.025em;line-height:1.05}
.id__chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--r-pill);
  font-size:.8125rem;font-weight:800;color:var(--text);background:rgba(var(--surface-rgb),.8);border:1px solid var(--border);
}
.chip--pos{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}

/* ============ Bento info ============ */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:26px var(--gutter) 0}
.tile{
  position:relative;padding:14px;border-radius:22px;min-width:0;
  background:linear-gradient(135deg,var(--surface) 55%,rgba(var(--accent-rgb),.05));border:1px solid var(--border);
  transition:transform .2s var(--ease),border-color .2s var(--ease);
}
.tile:hover{transform:translateY(-2px);border-color:var(--border-hover)}
.tile--wide{grid-column:1/-1}
.js .tile{opacity:0;transform:translateY(14px)}
.js .tile.is-in{opacity:1;transform:none;transition:opacity .5s var(--ease) var(--d,0ms),transform .5s var(--ease) var(--d,0ms),border-color .2s var(--ease)}
.js .tile.is-in:hover{transform:translateY(-2px);transition-delay:0ms}
.lbl{display:flex;align-items:center;gap:8px;font-size:.6875rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary)}
.lbl svg{color:var(--accent)}
.big{margin-top:12px;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.big b{font-size:2.5rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.big span{font-size:.875rem;font-weight:700;color:var(--text-secondary)}
.val{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:1.0625rem;font-weight:800}

/* height gauge */
.gauge{position:relative;height:6px;margin-top:14px;border-radius:var(--r-pill);background:var(--surface-2)}
.gauge i{position:absolute;inset:0;width:var(--p);border-radius:inherit;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform 1s var(--ease) .3s}
.tile.is-in .gauge i{transform:none}
.gauge em{position:absolute;left:var(--p);top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);opacity:0;transition:opacity .3s var(--ease) 1s}
.tile.is-in .gauge em{opacity:1}
.scale{display:flex;justify-content:space-between;margin-top:7px;font-size:.625rem;font-weight:700;color:var(--text-tertiary);font-variant-numeric:tabular-nums}

/* foot */
.feet{display:flex;gap:8px;margin-top:12px}
.foot{
  flex:1;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:.875rem;font-weight:800;color:var(--text-tertiary);background:rgba(var(--bg-rgb),.5);border:1px solid var(--border);
}
.foot.is-on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}

/* position + mini pitch */
.pos{display:flex;align-items:center;justify-content:space-between;gap:14px}
.pos__t b{display:block;margin-top:12px;font-size:1.375rem;font-weight:800;line-height:1.1}
.pos__t small{display:block;margin-top:4px;font-size:.75rem;font-weight:600;color:var(--text-tertiary)}
.pitch{flex:0 0 auto;width:132px;height:84px}
.pitch *{fill:none;stroke:rgba(var(--accent-rgb),.4);stroke-width:1.5}
.pitch .bg{fill:rgba(var(--accent-rgb),.06);stroke:rgba(var(--accent-rgb),.4)}
.pitch .dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.pitch .ring{stroke:rgba(var(--accent-rgb),.5);animation:ping 2.2s var(--ease) infinite;transform-origin:center;transform-box:fill-box}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}

/* club */
.club{display:flex;align-items:center;gap:12px;margin-top:12px}
.club b{display:block;font-size:1.125rem;font-weight:800;line-height:1.2}
.club small{display:block;margin-top:2px;font-size:.75rem;font-weight:600;color:var(--text-tertiary)}

.credit{padding:18px var(--gutter) 0;text-align:center;font-size:.6875rem;font-weight:600;color:var(--text-tertiary)}

/* ============ Preview switch (design review only) ============ */
.preview{
  position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:4px;padding:5px;border-radius:var(--r-pill);
  background:rgba(var(--surface-rgb),.92);border:1px solid var(--border-hover);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 18px 40px rgba(0,0,0,.45);
}
.preview small{padding:0 8px 0 12px;font-size:.625rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary)}
.preview button{
  min-height:44px;padding:0 14px;border-radius:var(--r-pill);font-size:.8125rem;font-weight:800;color:var(--text-secondary);white-space:nowrap;
  transition:background .2s var(--ease),color .2s var(--ease);
}
.preview button:hover{color:var(--text)}
.preview button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

@media (max-width:430px){.preview small{display:none}}
@media (max-width:350px){
  :root{--gutter:14px}
  .pitch{width:108px;height:70px}
  .preview small{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .tile{opacity:1;transform:none}
  .gauge i{transform:none}.gauge em{opacity:1}
}
</style>
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<div class="app">

  <header class="top" id="top">
    <a class="icon-btn" href="#back" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="top__t">Player</div>
    <button class="icon-btn" id="follow" type="button" aria-pressed="false" aria-label="Follow player">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
    </button>
  </header>

  <section class="hero" id="hero">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="hero__name" id="bigName" aria-hidden="true"></div>
    <div class="figure" id="figure"></div>
    <div class="fchip club-chip" id="clubChip"></div>
    <div class="fchip gk" id="gk" aria-hidden="true"></div>
  </section>

  <section class="id" id="id"></section>
  <section class="bento" id="bento" aria-label="Player info"></section>
  <p class="credit" id="credit"></p>
</div>

<!-- design review switch: remove in production, the page only needs PLAYER.photo -->
<div class="preview" role="group" aria-label="Design preview">
  <small>Preview</small>
  <button type="button" id="pOn" aria-pressed="true">With photo</button>
  <button type="button" id="pOff" aria-pressed="false">No photo</button>
</div>

const P = PLAYER;
document.documentElement.style.setProperty('--club', P.clubColor);

/* ============ Hero figure: photo or silhouette ============ */
const SIL = `<svg viewBox="0 0 512 512" role="img" aria-label="No photo available">
  <defs><linearGradient id="silG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" style="stop-color:color-mix(in srgb,var(--club) 55%,var(--surface-2))"/>
    <stop offset="1" style="stop-color:var(--surface)"/></linearGradient></defs>
  <path class="sil__body" d="M110 512 L120 270 C122 228 156 204 204 192 L234 184 L278 184 L308 192 C356 204 390 228 392 270 L402 512 Z"/>
  <path class="sil__arm" d="M140 290 L134 512M372 290 L378 512"/>
  <rect class="sil__neck" x="231" y="150" width="50" height="46" rx="14"/>
  <ellipse class="sil__head" cx="256" cy="106" rx="47" ry="59"/>
  <path class="sil__hair" d="M209 98C209 54 232 42 256 42c26 0 48 12 48 56-12-20-28-26-48-26s-36 6-47 26z"/>
  <text class="sil__ini" x="256" y="318" text-anchor="middle">${esc(initials(P.first,P.last))}</text></svg>`;

let withPhoto = !!P.photo;
function renderFigure(){
  const useImg = withPhoto && P.photo;
  $('#figure').innerHTML = `<div class="figure__in">${useImg
    ? `<img src="${esc(P.photo)}" alt="${esc(P.first+' '+P.last)}, ${esc(P.club)} ${esc(P.position.toLowerCase())}" width="512" height="512" decoding="async">`
    : SIL}</div>`;
  $('#hero').querySelectorAll('.nophoto').forEach(n=>n.remove());
  if(!useImg) $('#hero').insertAdjacentHTML('beforeend','<span class="nophoto">Photo not available</span>');
  $('#credit').textContent = useImg && P.credit ? `Photo: ${P.credit}` : '';
  $('#pOn').setAttribute('aria-pressed',String(!!useImg));
  $('#pOff').setAttribute('aria-pressed',String(!useImg));
}

/* ============ Static parts ============ */
const clubCrest = (cls)=>`<span class="crest crest--${cls}" aria-hidden="true">${esc(P.club.slice(0,2).toUpperCase())}</span>`;
$('#bigName').textContent = P.last;
$('#clubChip').innerHTML = `${clubCrest('sm')}${esc(P.club)}`;
$('#gk').textContent = P.pos;
$('#id').innerHTML = `
  <p class="id__first" style="--i:0">${esc(P.first)}</p>
  <h1 class="id__last" style="--i:1">${esc(P.last)}</h1>
  <div class="id__chips" style="--i:2"><span class="chip chip--pos">${esc(P.position)}</span>
    <span class="chip">${clubCrest('sm')}${esc(P.club)}</span></div>`;

const gaugeP = Math.max(0,Math.min(1,(P.height-160)/50))*100;
const foot = f=>`<span class="foot${P.foot.toLowerCase()===f.toLowerCase()?' is-on':''}">${f[0]}</span>`;
$('#bento').innerHTML = `
  <article class="tile" style="--d:0ms"><div class="lbl">${IC.cal}Age</div>
    <div class="big"><b data-count="${P.age}">${P.age}</b><span>yrs</span></div>
    <div class="gauge" style="--p:${(Math.max(0,Math.min(1,(P.age-16)/24))*100).toFixed(1)}%" aria-hidden="true"><i></i><em></em></div>
    <div class="scale" aria-hidden="true"><span>16</span><span>40</span></div></article>
  <article class="tile" style="--d:70ms"><div class="lbl">${IC.ruler}Height</div>
    <div class="big"><b data-count="${P.height}">${P.height}</b><span>cm</span></div>
    <div class="gauge" style="--p:${gaugeP.toFixed(1)}%" aria-hidden="true"><i></i><em></em></div>
    <div class="scale" aria-hidden="true"><span>160</span><span>210</span></div></article>
  <article class="tile" style="--d:140ms"><div class="lbl">${IC.globe}Nationality</div>
    <div class="val">${FLAGS[P.flag]||''}<span>${esc(P.nationality)}</span></div></article>
  <article class="tile" style="--d:210ms"><div class="lbl">${IC.foot}Preferred foot</div>
    <div class="feet" role="img" aria-label="${esc(P.foot)} foot">${foot('Left')}${foot('Right')}</div></article>
  <article class="tile tile--wide" style="--d:280ms"><div class="pos">
    <div class="pos__t"><div class="lbl">${IC.pos}Position</div><b>${esc(P.position)}</b><small>${esc(P.pos)} · last line of defence</small></div>
    <svg class="pitch" viewBox="0 0 132 84" aria-hidden="true">
      <rect class="bg" x="1" y="1" width="130" height="82" rx="6"/><path d="M66 1v82"/><circle cx="66" cy="42" r="12"/>
      <rect x="1" y="22" width="20" height="40"/><rect x="1" y="32" width="8" height="20"/>
      <rect x="111" y="22" width="20" height="40"/><rect x="123" y="32" width="8" height="20"/>
      <circle class="ring" cx="14" cy="42" r="5"/><circle class="dot" cx="14" cy="42" r="5"/></svg></div></article>
  <article class="tile tile--wide" style="--d:350ms"><div class="lbl">${IC.shield}Club</div>
    <div class="club">${clubCrest('md')}<div><b>${esc(P.club)}</b><small>Current club</small></div></div></article>`;

/* ============ Scroll: header, parallax, tile reveal, count-up ============ */
const topbar=$('#top'); let tick=false;
addEventListener('scroll',()=>{
  if(tick) return; tick=true;
  requestAnimationFrame(()=>{
    topbar.classList.toggle('is-scrolled',scrollY>8);
    if(!reduce && scrollY<700) document.documentElement.style.setProperty('--py',scrollY);
    tick=false;
  });
},{passive:true});

function countUp(el){
  const t=+el.dataset.count; if(reduce) return;
  const t0=performance.now();
  const step=now=>{const p=Math.min(1,(now-t0)/900),e=1-Math.pow(1-p,3);el.textContent=Math.round(t*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
const io='IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting) return;
  en.target.classList.add('is-in'); en.target.querySelectorAll('[data-count]').forEach(countUp); io.unobserve(en.target);
}),{threshold:.2}) : null;
document.querySelectorAll('.tile').forEach(t=> io ? io.observe(t) : t.classList.add('is-in'));

/* ============ Interactions ============ */
$('#follow').addEventListener('click',e=>{
  const b=e.currentTarget, on=b.getAttribute('aria-pressed')!=='true';
  b.setAttribute('aria-pressed',String(on)); b.setAttribute('aria-label',on?'Unfollow player':'Follow player');
  document.dispatchEvent(new CustomEvent('player:follow',{detail:{on}}));
});
$('#pOn').addEventListener('click',()=>{ withPhoto=true; renderFigure(); });
$('#pOff').addEventListener('click',()=>{ withPhoto=false; renderFigure(); });
renderFigure();
</script>
</body>
</html>
